name: Export canonical Kano assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-canonical-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build asset archive
        run: |
          zip -r kano-canonical-source.zip README.md CITATION.cff LICENSE project.json assets data docs reports validation scripts notebooks requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kano-canonical-source
          path: kano-canonical-source.zip
          retention-days: 1
